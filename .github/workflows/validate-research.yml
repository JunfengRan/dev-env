name: Validate Research Workflow

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
    paths:
      - "spec/**"
      - "scripts/**"
      - "plugins/**"
      - "docs/examples/sample-research-run/**"
      - "package.json"
      - "package-lock.json"
      - ".puppeteerrc.cjs"
      - ".cursor-plugin/**"
      - ".github/workflows/validate-research.yml"
  pull_request:
    paths:
      - "spec/**"
      - "scripts/**"
      - "plugins/**"
      - "docs/examples/sample-research-run/**"
      - "package.json"
      - "package-lock.json"
      - ".puppeteerrc.cjs"
      - ".cursor-plugin/**"
      - ".github/workflows/validate-research.yml"

jobs:
  research:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run validate

      - run: npm audit --audit-level=high

  hooks:
    name: Bun hooks on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - run: npm run test:hooks
